#!/usr/bin/env python
PACKAGE = "tandem"

from dynamic_reconfigure.parameter_generator_catkin import *


# Dynamic reconfigure file for the vertical_inspector controller. It defines the
# PID gains, velocity limits, tolerances and filtering parameters used to control
# the vehicle motion along the Y and Z axes. These parameters can be adjusted at
# runtime without modifying the controller code, which makes tuning the approach
# behavior easier during simulation tests.

gen = ParameterGenerator()

#       Name          Type      Level Description                  Default  Min   Max
# ------------------------------------------------------------------------------------
# Parameters Y axis.
gen.add("kp_y",       double_t, 0,    "Proportional Gain Y",        0.15,    0.0,  1)
gen.add("ki_y",       double_t, 0,    "Integral Gain Y",            0.05,    0.0,  1)
gen.add("kd_y",       double_t, 0,    "Derivative Gain Y",          0.00,    0.0,  1) 
gen.add("int_y_limit",double_t, 0,    "Integral Limit Y",           0.2,     0.0,  0.5) 
gen.add("vy_max",     double_t, 0,    "Maximum Velocity Y",         0.4,     0.0,  1.0)
gen.add("tol_y",      double_t, 0,    "Tolerance Y (meters)",       0.5,     0.01, 2.0)

# Parameters Z axis.
gen.add("kp_z",       double_t, 0,    "Proportional Gain Z",        0.1,    0.0,  1)
gen.add("kd_z",       double_t, 0,    "Derivative Gain Z",          0.00,    0.0,  1)
gen.add("ki_z",       double_t, 0,    "Integral Gain Z",            0.05,    0.0,  1)
gen.add("vz_max",     double_t, 0,    "Maximum Velocity Z",         0.4,     0.0,  1.0)
gen.add("int_z_limit",double_t, 0,    "Integral Limit Z",           0.2,     0.0,  1.0)
gen.add("tol_z",      double_t, 0,    "Tolerance Z (meters)",       0.5,     0.01, 2.0)

# Filters.
gen.add("alpha_filter", double_t, 0,  "Low-pass filter (0-1)",      0.3,     0.0,  1.0)
gen.add("max_dv",       double_t, 0,  "Max acceleration per cycle",  0.10,    0.0,  1.0)

exit(gen.generate(PACKAGE, "vertical_inspector", "VerticalInspector"))