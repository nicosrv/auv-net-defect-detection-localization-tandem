name: yolo_env
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- ROS Essentials (Para que funcione rosbag y demás) ---
      - rospkg
      - catkin-pkg
      - pyyaml
      - netifaces
      
      # --- Computer Vision & AI (El cerebro) ---
      # Ultralytics instala solo: Torch, Numpy, Pandas, Matplotlib, Pillow
      - ultralytics==8.4.14
      - opencv-python==4.12.0.88
      - scipy
      
      # --- Utilidades varias ---
      - psutil
      - requests
